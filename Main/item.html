    </div>

    <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
    <div class="page-wrapper">

      <!-- Breadcrumb -->
      <p class="breadcrumb-trail Pages">
        <a href="mainpage.html">Home</a>
        <span class="crumb-sep">›</span>
        <a href="catalogue.html">Catalogue</a>
        <span class="crumb-sep">›</span>
        <span id="product-category">...</span>
        <span class="crumb-sep">›</span>
        <span id="product-name">...</span>
      </p>

      <!-- Product Layout -->
      <div class="main-container">

        <!-- LEFT: Image + Buttons -->
        <div class="product-left">
          <div class="image-card Coffee">
            <img
              class="product-image"
              id="product-image"
              src=""
              alt=""
            />
          </div>
          <div class="Buy">
            <button class="addtocart" onclick="">
              <i class="fa fa-cart-plus"></i> Add to Cart
            </button>
            <button class="buywithvoucher">
              <i class="fa fa-bolt"></i> Buy Now
            </button>
          </div>
        </div>

        <!-- RIGHT: Info + Comments -->
        <div class="product-right Description">

          <!-- Product Info -->
          <div class="product-info-block">
            <p class="NameCoffee" id="product-title">Loading...</p>
            <div class="product-meta">
              <span id="productRating">⭐⭐⭐⭐⭐</span>
              <span class="meta-divider">|</span>
              <span id="totalComments">0</span> Reviews
              <span class="meta-divider">|</span>
              <span id="totalSold">0</span> Sold
            </div>
            <p class="Price" id="product-price"></p>
            <p class="product-desc" id="product-description"></p>
          </div>

          <!-- Divider -->
          <div class="section-divider"></div>

          <!-- Comments Section -->
          <div class="comments-section">
            <h1>Reviews</h1>

            <!-- Star Filter -->
            <div class="star-filter">
              <button class="star-filter-btn active" data-stars="all">All</button>
              <button class="star-filter-btn" data-stars="5">⭐⭐⭐⭐⭐</button>
              <button class="star-filter-btn" data-stars="4">⭐⭐⭐⭐</button>
              <button class="star-filter-btn" data-stars="3">⭐⭐⭐</button>
              <button class="star-filter-btn" data-stars="2">⭐⭐</button>
              <button class="star-filter-btn" data-stars="1">⭐</button>
            </div>

            <!-- Comments List -->
            <div class="comments-list" id="comments-list">
              <p>Loading comments...</p>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
