<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Coiny&family=Jua&family=Lexend:wght@100..900&family=Sniglet:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/Css/style-login.css" />
  </head>
  <body>
    <div class="slider">
      <div class="slide-track">
        <img
          class="carousel"
          src="https://images.pexels.com/photos/15697027/pexels-photo-15697027.jpeg"
        />
        <img
          class="carousel"
          src="https://images.pexels.com/photos/33740268/pexels-photo-33740268.png"
        />
        <img
          class="carousel"
          src="https://images.pexels.com/photos/15865550/pexels-photo-15865550.jpeg"
        />
        <img
          class="carousel"
          src="https://images.pexels.com/photos/35116507/pexels-photo-35116507.jpeg"
        />
        <img
          class="carousel"
          src="https://images.pexels.com/photos/32488184/pexels-photo-32488184.jpeg"
        />

        <img
          class="carousel"
          src="https://images.pexels.com/photos/15697027/pexels-photo-15697027.jpeg"
        />
        <img
          class="carousel"
          src="https://images.pexels.com/photos/33740268/pexels-photo-33740268.png"
        />
        <img
          class="carousel"
          src="https://images.pexels.com/photos/15865550/pexels-photo-15865550.jpeg"
        />
        <img
          class="carousel"
          src="https://images.pexels.com/photos/35116507/pexels-photo-35116507.jpeg"
        />
        <img
          class="carousel"
          src="https://images.pexels.com/photos/32488184/pexels-photo-32488184.jpeg"
        />
      </div>
    </div>
    <div class="main-container">
      <div class="login">
        <img src="assets/img/logo.png" alt="logo" style="width: 100px" />
        <h1 class="heading">Login</h1>
          <div>
            <input
              id="email"
              class="input"
              type="text"
              placeholder="Email"
              required
            />
          </div>
          <div>
            <input
              id="password"
              class="input"
              type="password"
              placeholder="Password"
              required
            />
          </div>
          

            <span><a class="forgot-pass-a" href="forgot.html">Forgot password?</a></span>
          <div>
            <button class="btn" onclick="handleLogin()">Let's Go</button>
          </div>

        

        <div class="signUp">
          <span
            >Don't Have an Account? <a href="signup.html">Click me!</a></span
          >
        </div>
      </div>
    </div>


    <!--SCRIPT-->
    <script src="assets/scripts/auth.js"></script>
  </body>
</html>
