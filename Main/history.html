<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KapeBara - Order History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Coiny&family=Jua&family=Lexend:wght@100..900&family=Sniglet:wght@400;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script
      src="https://kit.fontawesome.com/57260c913b.js"
      crossorigin="anonymous"
    ></script>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/Css/chat.css">
    <link rel="stylesheet" href="assets/Css/history.css" />
    <link rel="stylesheet" href="assets/Css/navbar.css" />
  </head>
  <body>

    <!-- ── NAVBAR ── -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="mainpage.html">
          <img src="assets/img/logo.png" style="width: 75px" alt="" />
          KapeBara
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="mainpage.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Services.html">Services</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Catalogue
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="catalogue.html#drinks">Drinks</a>
                </li>
                <li>
                  <a class="dropdown-item" href="catalogue.html#snacks">Snacks</a>
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" aria-disabled="true" href="AboutUs.html">About Us</a>
            </li>
          </ul>
          <div id="user-name">
            <a class="nav-link" aria-disabled="true" href="login.html">Login</a>
            <form action="signup.html">
              <button class="btn">Signup</button>
            </form>
          </div>
          <div id="logout">
            <!--CREATES A LOGOUT BUTTON-->
          </div>
        </div>
      </div>
    </nav>

    <!-- ── MAIN CONTENT ── -->
    <div class="container">

      <h1 class="title">🕐 Order History</h1>
      <p class="subtitle">All your past orders in one place</p>

      <!-- States -->
      <div id="loading-state" class="state-box">
        <i class="fa fa-spinner fa-spin"></i>
        <p>Loading your orders...</p>
      </div>

      <div id="empty-state" class="state-box" style="display:none;">
        <i class="fa fa-box-open"></i>
        <p>You haven't placed any orders yet.</p>
      </div>

      <div id="error-state" class="state-box" style="display:none;">
        <i class="fa fa-circle-exclamation"></i>
        <p id="error-msg">Something went wrong. Please try again.</p>
      </div>

      <!-- Orders List -->
      <div id="orders-list"></div>
    </div>

    <!-- ── CHAT BUTTON (same as mainpage) ── -->
    <button id="open-chat-btn" class="chat-toggle" title="Chat">
      💬
      <span id="chat-notification-badge" class="notification-badge hidden">0</span>
    </button>
    <div id="chat-popup" class="chat-popup" aria-hidden="true">
      <div class="header">
        <div>Chat</div>
        <div class="header-buttons">
          <button
            id="chat-back-btn"
            class="header-btn"
            style="display: none;"
            title="Back"
          >
            ← Back
          </button>
          <button
            id="close-chat-btn"
            class="header-btn"
            title="Close"
          >
            ✖
          </button>
        </div>
      </div>
      <div class="content" id="chat-content">
        <div class="chat-option-list">
          <button id="btn-ai-chat" class="btn btn-outline-secondary">
            AI Chat
          </button>
          <button id="btn-admin-chat" class="btn btn-outline-primary">
            Admin Chat
          </button>
        </div>
      </div>
    </div>

    <script src="assets/scripts/history.js"></script>
    <script src="assets/scripts/auth.js"></script>
    <script src="assets/scripts/chat.js"></script>
  </body>
</html>
